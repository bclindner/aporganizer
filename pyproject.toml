[project]
name = "aporganizer"
version = "1.0.2"
description = "An Archipelago randomizer organizer for Discord."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.6.4",
    "pytest>=9.0.1",
    "pyyaml>=6.0.3",
]
[project.scripts]
aporganizer = "cli:run"

[tool.pytest.ini_options]
pythonpath = [
	"src"
]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.7",
    "tox>=4.32.0",
]
