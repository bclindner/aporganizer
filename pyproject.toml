[project]
name = "aporganizer"
version = "1.0.0"
description = "An Archipelago randomizer organizer for Discord."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.6.4",
    "pytest>=9.0.1",
    "pyyaml>=6.0.3",
]
[project.scripts]
aporganizer = "cli:run"
[tool.pytest.ini_options]
pythonpath = [
	"src"
]
