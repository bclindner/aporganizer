[tox]
requires = tox>=4
env_list = test, format, check

[testenv:test]
description = run unit tests with pytest
deps = pytest>=9
commands =
	pytest {posargs:tests}

[env.check]
description = lint with ruff
deps = ruff
commands =
	ruff check {posargs:.}

[env.format]
description = format with ruff
deps = ruff
commands =
	ruff format --check {posargs:.}
